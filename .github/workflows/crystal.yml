name: Crystal CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    container:
      image: crystallang/crystal

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: shards install
    - name: Run tests
      run: crystal spec
    - name: Run Facet-only workspace contract
      run: CRA_FACET_ONLY=1 crystal spec spec/cra/workspace
    - name: Build artifact
      run: crystal build --release
